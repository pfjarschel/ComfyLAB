[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfylab"
dynamic = ["version"]
description = "ComfyLAB - Visual Automation, Hardware Interfacing, and Signal Processing Engine"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Paulo Felipe Jarschel"}
]
keywords = [
    "automation",
    "scada",
    "lab-automation",
    "test-and-measurement",
    "signal-processing",
    "pyvisa",
    "flow-based-programming",
    "fastapi",
    "react"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "numpy>=1.20.0",
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
    "pyusb>=1.2.1",
    "pyserial>=3.5",
    "gpib-ctypes>=0.3.0",
    "zeroconf>=0.38.0",
    "psutil>=5.9.0",
    "scipy>=1.7.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.0",
    "Pillow>=10.0.0",
    "nidaqmx>=0.6.5",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
comfylab = "comfylab.cli:main"

[project.urls]
Homepage = "https://github.com/pfjarschel/ComfyLAB"
Repository = "https://github.com/pfjarschel/ComfyLAB"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "comfylab*", "frontend*"]
exclude = ["tests*", "frontend.node_modules*", "frontend.src*", "frontend.public*"]

[tool.setuptools.package-data]
backend = ["*.txt"]
frontend = ["dist/**/*", "dist/*"]
comfylab = ["examples/*.json", "clusters/**/*.json", "clusters/*.json"]
